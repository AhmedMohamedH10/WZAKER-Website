# نسخ احتياطي يومي لقاعدة D1 (wzaker): بيتصدّر، بيتشفّر، وبيتحفظ كـ Artifact لمدة 30 يوم.
# الشفرة (AES-256) ضرورية لأن القاعدة فيها إيميلات اللاعبين، والـ Artifacts في المستودعات العامة ممكن تتحمّل.
name: D1 Backup

on:
  schedule:
    - cron: "0 1 * * *"      # كل يوم 01:00 UTC
  workflow_dispatch:         # تشغيل يدوي من تبويب Actions

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 export wzaker --remote --output=backup.sql

      - name: Sanity check
        run: |
          test -s backup.sql
          grep -q "CREATE TABLE" backup.sql
          grep -q "players" backup.sql
          echo "size: $(wc -c < backup.sql) bytes, players inserts: $(grep -c 'INSERT INTO "\?players"\?' backup.sql || true)"

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE"
          D=$(date -u +%Y-%m-%d)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in backup.sql -out "wzaker-$D.sql.enc" -pass env:BACKUP_PASSPHRASE
          rm -f backup.sql
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: wzaker-d1-backup
          path: wzaker-*.sql.enc
          retention-days: 30
          if-no-files-found: error
