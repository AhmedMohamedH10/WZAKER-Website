<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة | وذكر</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#090f0b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/img/favicon-v3.png">
<link rel="stylesheet" href="/css/style.css?v=8">
<style>
.nf{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.nf img{width:120px;height:120px;border-radius:22.5%;box-shadow:0 0 0 1px rgba(var(--accent-rgb),.3),0 16px 48px rgba(var(--accent-rgb),.22)}
.nf h1{font-family:var(--font-first);font-weight:400;font-size:1.6rem;margin-top:10px}
.nf p{color:var(--dim)}
.nf a{margin-top:8px;color:var(--accent);text-decoration:none;border:1px solid rgba(var(--accent-rgb),.35);border-radius:999px;padding:9px 24px}
.nf a:hover,.nf a:focus-visible{background:rgba(var(--accent-rgb),.08);border-color:var(--accent)}
</style>
</head>
<body>
<main class="nf">
  <img src="/assets/img/logo-v2.webp" alt="وذكر" width="120" height="120">
  <h1>الصفحة غير موجودة</h1>
  <p>ربما تغيّر الرابط أو كُتب خطأً.</p>
  <a href="/">العودة إلى الصفحة الرئيسية</a>
</main>
</body>
</html>
